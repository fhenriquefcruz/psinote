name: Temporary Phase 8 dependency lockfile refresh
on:
  push:
    branches: ['phase-8/production-readiness']
    paths:
      - 'package.json'
      - '.github/workflows/phase-8-deps-refresh.yml'

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Resolve patched lockfile without running dependency scripts
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=moderate
      - name: Commit resolved dependency graph to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh audited dependency lockfile"
            git push origin HEAD:phase-8/production-readiness
          fi
