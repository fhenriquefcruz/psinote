name: One-time lockfile sync

on:
  push:
    branches:
      - phase-7/quality-engineering
    paths:
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-7/quality-engineering

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize validated dependency lockfile"
          git push origin HEAD:phase-7/quality-engineering
